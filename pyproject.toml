[project]
name = "app-indemnizaciones"
version = "0.1.0"
description = "MVP Dash para cálculo de indemnización sustitutiva de vejez con IPC histórico y CETIL"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17.0",
    "dash-bootstrap-components>=1.6.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "xlsxwriter>=3.2.0",
    "python-dateutil>=2.9.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
